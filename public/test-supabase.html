<!DOCTYPE html>
<html>
<head>
    <title>Supabase Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .status { padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .loading { background: #d1ecf1; color: #0c5460; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Supabase Connection Test</h1>
    
    <div id="status" class="status loading">Checking connection...</div>
    <div id="details"></div>
    
    <button onclick="testConnection()">Test Connection</button>
    <button onclick="testLogin()">Test Login</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const statusDiv = document.getElementById('status');
        const detailsDiv = document.getElementById('details');

        // Check if environment variables are loaded
        const SUPABASE_URL = 'https://xzzorozwxydpjxdrxtsi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6em9ydXp3eHlkcGp4ZHJ4dHNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MjAxODYsImV4cCI6MjEwMjA5NjE4Nn0.-aARGuAajmAo4gXGsXrBiD8hs2oDI5_WxBLDcgmhSfk';

        console.log('Supabase URL:', SUPABASE_URL);
        console.log('Supabase Key length:', SUPABASE_KEY.length);

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function testConnection() {
            statusDiv.className = 'status loading';
            statusDiv.textContent = 'Testing connection...';
            detailsDiv.innerHTML = '';

            try {
                // Test basic query
                const { data, error } = await supabase
                    .from('organizations')
                    .select('count');

                if (error) {
                    throw error;
                }

                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ Connection successful!';
                detailsDiv.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = '❌ Connection failed!';
                detailsDiv.innerHTML = '<pre>' + error.message + '</pre>';
                console.error('Connection error:', error);
            }
        }

        async function testLogin() {
            statusDiv.className = 'status loading';
            statusDiv.textContent = 'Testing login...';
            detailsDiv.innerHTML = '';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: 'payer@demo.com',
                    password: 'Demo123456!'
                });

                if (error) {
                    throw error;
                }

                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ Login successful!';
                detailsDiv.innerHTML = '<pre>User ID: ' + data.user.id + '\nEmail: ' + data.user.email + '</pre>';
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = '❌ Login failed!';
                detailsDiv.innerHTML = '<h3>Error Details:</h3><pre>' + JSON.stringify(error, null, 2) + '</pre>';
                console.error('Login error:', error);
            }
        }

        // Auto test on load
        testConnection();
    </script>
</body>
</html>
